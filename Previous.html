<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>闭环光链 · 电影随机选择器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Poppins', sans-serif;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5H24L16.5 15.5L19 24L12 18L5 24L7.5 15.5L0 9.5H9.5L12 0Z" fill="none" stroke="%23FFD700" stroke-width="1.4"/></svg>') 12 12, auto !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        body:active {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5H24L16.5 15.5L19 24L12 18L5 24L7.5 15.5L0 9.5H9.5L12 0Z" fill="none" stroke="%23FFDF40" stroke-width="1.8"/></svg>') 9 9, auto !important;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #curveCanvas {
            z-index: 1;
            pointer-events: none;
        }

        #clickCanvas {
            z-index: 2;
        }

        .header {
            position: fixed;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            text-align: center;
        }

        .logo-text {
            font-size: 3.2rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255,215,0,0.6), 0 0 30px rgba(255,215,0,0.3);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(255,215,0,0.7);
            margin-top: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255,215,0,0.3);
        }

        .enter-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 48px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #000;
            background: linear-gradient(135deg, #FFD700, #FFC107);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(255,215,0,0.5), 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            z-index: 999;
        }

        .enter-btn:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 0 30px rgba(255,215,0,0.8), 0 6px 20px rgba(0,0,0,0.4);
        }

        .tip {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFD700;
            font-size: 0.9rem;
            opacity: 0.9;
            z-index: 999;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(255,215,0,0.5);
            background: rgba(0,0,0,0.4);
            padding: 5px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            font-weight: 500;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            z-index: 0;
            animation: starFade 3s infinite alternate;
        }

        @keyframes starFade {
            0% { opacity: 0.2; transform: scale(1);}
            100% { opacity: 0.9; transform: scale(1.1);}
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 32px;
            width: 90%;
            max-width: 620px;
            max-height: 85vh;
            padding: 30px 35px 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,215,0,0.3);
            animation: fadeInUp 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            color: #111;
            position: relative;
            overflow-y: auto;
            text-align: center;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .close {
            position: absolute;
            top: 20px;
            right: 26px;
            font-size: 32px;
            cursor: pointer;
            color: #7f6b2c;
            transition: all 0.25s ease;
            z-index: 10;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f5f0e0;
        }

        .close:hover {
            color: #FFD700;
            background: #1f1b0e;
            transform: rotate(90deg);
        }

        .modal-img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 24px;
            margin: 18px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 2px solid #FFD700;
        }

        .modal-title {
            color: #c89a2c;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .modal-desc {
            line-height: 1.7;
            font-size: 1rem;
            color: #2c2c2c;
            margin: 12px 0;
            text-align: left;
        }

        .modal-quote {
            color: #b47c2e;
            font-style: italic;
            padding: 18px 20px;
            border-left: 5px solid #FFD700;
            background: #fffcf0;
            font-size: 1.1rem;
            border-radius: 18px;
            margin-top: 15px;
            font-weight: 500;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1e6cf;
        }
        ::-webkit-scrollbar-thumb {
            background: #c89a2c;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="container">
  <canvas id="curveCanvas"></canvas>
  <canvas id="clickCanvas"></canvas>
</div>

<div class="header">
  <div class="logo-text">电影随机选择器</div>
  <div class="subtitle">←拖动鼠标滑动线条 → 点击白色圆点随机选择</div>
</div>
<a href="home.html" class="enter-btn">进入官网</a>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="close" id="close">&times;</div>
    <div class="modal-title" id="mTitle"></div>
    <img class="modal-img" id="mImg" alt="电影封面">
    <div class="modal-desc" id="mDesc"></div>
    <div class="modal-quote" id="mQuote"></div>
  </div>
</div>

<script>
    // ======================= 闭环核心：黄线以首尾白点为边界 =======================
    // 电影原始数据（offset 为 0~1 比例）
    const moviesRaw = [
      { offset: 0.04, title: "🎬 超能陆战队", img: "./img/0.avif", desc: "迪士尼暖心动画，天才少年小宏与医疗机器人大白化身超能英雄，拯救城市。温柔与勇气永远是最强大的力量。", quote: "你不必完美，只需要做自己。" },
      { offset: 0.09, title: "🎬 当幸福来敲门", img: "./img/OIP-C.webp", desc: "教育意义神作。生活再难，坚持与努力终会迎来曙光，父子情深催人泪下。", quote: "别让任何人告诉你，你成不了才。" },
      { offset: 0.15, title: "🎬 三傻大闹宝莱坞", img: "./img/R-C.png", desc: "喜剧+教育神作。讽刺填鸭式教育，告诉我们要追求热爱，活成自己想要的样子。", quote: "追求卓越，成功就会在不经意间追上你。" },
      { offset: 0.21, title: "🎬 寻梦环游记", img: "./img/v2-81445f5ad6c8ab85a49875f668eccf72_r.jpg", desc: "皮克斯治愈动画，关于家人、梦想与死亡的教育故事，温暖又有深度。", quote: "真正的死亡，是世界上再也没有人记得你。" },
      { offset: 0.27, title: "🎬 美丽人生", img: "./img/R-C.jpg", desc: "父爱与勇气的极致表达，用喜剧演绎悲剧，教会我们乐观与守护。", quote: "早安，公主！" },
      { offset: 0.33, title: "🎬 肖申克的救赎", img: "./img/OIP-C.jpg", desc: "人生必看教育经典。希望与自由是人类最宝贵的东西，永远不要放弃自己。", quote: "懦怯囚禁人的灵魂，希望可以感受自由。" },
      { offset: 0.39, title: "🎬 千与千寻", img: "./img/20631d42ee9cc661086aeea3ce9262736896d2542993d9-8gP1S0_fw658.webp", desc: "宫崎骏经典神作，成长、善良与不忘初心，治愈无数人的成长寓言。", quote: "不管前方的路有多苦，只要方向正确，都比站在原地更幸福。" },
      { offset: 0.45, title: "🎬 心灵奇旅", img: "./img/xinling.webp", desc: "治愈系教育动画，重新定义生命的意义：活在当下，感受每一刻美好。", quote: "生活的目标，就是活着。" },
      { offset: 0.51, title: "🎬 阿甘正传", img: "./img/agan.webp", desc: "人生教科书级电影。坚持、善良、简单，往往能创造最伟大的人生。", quote: "生活就像一盒巧克力，你永远不知道下一颗是什么。" },
      { offset: 0.57, title: "🎬 疯狂动物城", img: "./img/20200730151716_cctls.png", desc: "励志喜剧动画，打破偏见、坚持梦想，每个人都能成为最好的自己。", quote: "任何人都能成为任何模样。" },
      { offset: 0.63, title: "🎬 星际穿越", img: "./img/xingji.jpg", desc: "科幻与爱的教育史诗，爱是唯一可以穿越时间与空间的力量。", quote: "爱是唯一可以超越时间与维度的事物。" },
      { offset: 0.69, title: "🎬 触不可及", img: "./img/t0121e3833405e738b7.jpg", desc: "温情喜剧，阶级、肤色、性格完全不同的人成为挚友，教会我们尊重与理解。", quote: "真正的尊重，是把对方当普通人。" },
      { offset: 0.75, title: "🎬 飞屋环游记", img: "./img/feiwu.webp", desc: "冒险与陪伴的治愈动画，梦想与爱情，勇气与陪伴。", quote: "幸福，不是长生不老，而是每一个微小愿望的达成。" },
      { offset: 0.87, title: "🎬 流浪地球", img: "./img/liulang.webp", desc: "中国科幻里程碑，家国情怀与人类命运共同体。", quote: "希望，是比钻石更珍贵的东西。" },
      { offset: 0.93, title: "🎬 长津湖", img: "./img/cjh.jpg", desc: "爱国教育战争片，铭记历史，珍惜和平，致敬英雄。", quote: "我们把该打的仗都打了，后代就不用打了。" },
    ];
    
    // 计算首尾白点的偏移量
    let minOffset = Infinity, maxOffset = -Infinity;
    for (let m of moviesRaw) {
        if (m.offset < minOffset) minOffset = m.offset;
        if (m.offset > maxOffset) maxOffset = m.offset;
    }
    
    // 闭环长度 = 首尾白点之间的距离
    const SCALE = 3800;
    const CYCLE_LEN = (maxOffset - minOffset) * SCALE;
    
    // 白点在世界坐标中的位置（0 到 CYCLE_LEN）
    const movies = moviesRaw.map(m => ({
        ...m,
        worldX: (m.offset - minOffset) * SCALE
    }));
    
    // 按 worldX 排序
    movies.sort((a, b) => a.worldX - b.worldX);
    
    // 链条配置（多层黄金线）
    const lineConfigs = [
        { w: 0.7, blur: 2, alpha: 0.18, phaseShift: -2.2 },
        { w: 0.9, blur: 3, alpha: 0.25, phaseShift: -1.0 },
        { w: 1.5, blur: 6, alpha: 0.4, phaseShift: 0.0 },
        { w: 3.8, blur: 14, alpha: 0.65, phaseShift: 0.0 },   // 主链条（穿过白点）
        { w: 1.4, blur: 5, alpha: 0.35, phaseShift: 1.5 },
        { w: 0.9, blur: 3, alpha: 0.22, phaseShift: 2.3 },
        { w: 0.6, blur: 2, alpha: 0.15, phaseShift: -1.8 },
    ];
    
    // ----- 闭环波形函数 -----
    // 在 [0, CYCLE_LEN] 范围内绘制，确保首尾Y值相同实现闭环
    function getCyclicY(x, time, phaseOffset = 0) {
        // 归一化到 [0, 1]
        const tNorm = (x % CYCLE_LEN) / CYCLE_LEN;
        
        // 使用整数倍谐波，确保 t=0 和 t=1 时 Y 值相同（闭环）
        const angle1 = tNorm * Math.PI * 2;
        const angle2 = angle1 * 2;
        const angle3 = angle1 * 3;
        const angle5 = angle1 * 5;
        
        const harmonic1 = Math.sin(angle2 + time * 0.12 + phaseOffset * 0.9) * 158;
        const harmonic2 = Math.sin(angle3 + time * 0.18 + phaseOffset * 1.2) * 72;
        const harmonic3 = Math.sin(angle5 + time * 0.23 - phaseOffset * 0.7) * 38;
        const harmonic4 = Math.sin(angle1 * 8 + time * 0.31 + phaseOffset * 1.5) * 22;
        
        return window.innerHeight / 2 + harmonic1 + harmonic2 + harmonic3 + harmonic4;
    }
    
    // 主链条Y坐标（用于白点定位）
    function getMainY(worldX, time) {
        return getCyclicY(worldX, time, 0);
    }
    
    // Canvas 元素
    const curveCanvas = document.getElementById('curveCanvas');
    const ctx = curveCanvas.getContext('2d');
    const clickCanvas = document.getElementById('clickCanvas');
    const clickCtx = clickCanvas.getContext('2d');
    
    let w = window.innerWidth, h = window.innerHeight;
    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        curveCanvas.width = w;
        curveCanvas.height = h;
        clickCanvas.width = w;
        clickCanvas.height = h;
    }
    resize();
    
    // 滑动偏移（无限旋转闭环）
    let offsetX = 0;      // 世界偏移量（取模后得到视觉偏移）
    let drag = false;
    let startX = 0;
    let animTime = 0;
    let visibleDots = [];
    let modalOpen = false;
    
    // 核心绘制：在 [0, CYCLE_LEN] 范围内绘制链条，实现真正的首尾闭环
    function draw() {
        if (!ctx || !clickCtx) return;
        ctx.clearRect(0, 0, w, h);
        clickCtx.clearRect(0, 0, w, h);
        
        // 视觉偏移量（在闭环范围内循环）
        let visualOffset = offsetX % CYCLE_LEN;
        if (visualOffset < 0) visualOffset += CYCLE_LEN;
        
        // 1. 绘制黄金线条
        // 为确保闭环边界处的连续性，绘制两段：
        // 第一段：[visualOffset, CYCLE_LEN]
        // 第二段：[0, visualOffset]（如果需要显示在屏幕左侧）
        for (let line of lineConfigs) {
            ctx.strokeStyle = `rgba(255, 215, 0, ${line.alpha})`;
            ctx.lineWidth = line.w;
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = line.blur;
            
            // 第一段：从 visualOffset 向右绘制
            ctx.beginPath();
            let started = false;
            for (let wx = visualOffset; wx <= CYCLE_LEN; wx += 3) {
                const y = getCyclicY(wx, animTime, line.phaseShift);
                const screenX = wx - visualOffset;
                if (screenX >= -10 && screenX <= w + 10) {
                    if (!started) {
                        ctx.moveTo(screenX, y);
                        started = true;
                    } else {
                        ctx.lineTo(screenX, y);
                    }
                }
            }
            ctx.stroke();
            
            // 第二段：如果屏幕左侧需要显示闭环末尾部分
            // 当 visualOffset 较小，或者绘制跨越边界时
            ctx.beginPath();
            started = false;
            for (let wx = 0; wx <= visualOffset; wx += 3) {
                const y = getCyclicY(wx, animTime, line.phaseShift);
                // 这部分绘制在屏幕右侧（闭环首尾相连）
                const screenX = wx - visualOffset + CYCLE_LEN;
                if (screenX >= -10 && screenX <= w + 10) {
                    if (!started) {
                        ctx.moveTo(screenX, y);
                        started = true;
                    } else {
                        ctx.lineTo(screenX, y);
                    }
                }
            }
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
        
        // 2. 绘制白点
        visibleDots = [];
        for (let movie of movies) {
            const worldX = movie.worldX;
            let screenX = worldX - visualOffset;
            
            // 如果 screenX 为负，说明白点在视觉偏移的左侧
            // 应该从闭环的另一端显示（加上 CYCLE_LEN）
            if (screenX < -30) {
                screenX += CYCLE_LEN;
            }
            
            if (screenX >= -60 && screenX <= w + 60) {
                const y = getMainY(worldX, animTime);
                // 外发光
                clickCtx.beginPath();
                clickCtx.arc(screenX, y, 13, 0, Math.PI * 2);
                clickCtx.fillStyle = '#FFFCE8';
                clickCtx.shadowColor = '#ffcc66';
                clickCtx.shadowBlur = 20;
                clickCtx.fill();
                // 内芯
                clickCtx.beginPath();
                clickCtx.arc(screenX, y, 6, 0, Math.PI * 2);
                clickCtx.fillStyle = '#FFD966';
                clickCtx.fill();
                clickCtx.shadowBlur = 0;
                clickCtx.beginPath();
                clickCtx.arc(screenX, y, 2.8, 0, Math.PI * 2);
                clickCtx.fillStyle = '#ffffff';
                clickCtx.fill();
                
                visibleDots.push({
                    screenX, screenY: y,
                    movie: movie
                });
            }
        }
    }
    
    // 动画循环
    function animate() {
        animTime += 0.0072;
        draw();
        requestAnimationFrame(animate);
    }
    
    // 拖拽交互
    function initDrag() {
        window.addEventListener('mousedown', (e) => {
            if (modalOpen) return;
            drag = true;
            startX = e.clientX;
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!drag || modalOpen) return;
            const dx = e.clientX - startX;
            if (dx !== 0) {
                offsetX -= dx;
                startX = e.clientX;
                // offsetX 无界，取模后链条始终显示闭环
            }
        });
        window.addEventListener('mouseup', () => drag = false);
        window.addEventListener('mouseleave', () => drag = false);
        
        // 触摸
        window.addEventListener('touchstart', (e) => {
            if (modalOpen) return;
            drag = true;
            startX = e.touches[0].clientX;
            e.preventDefault();
        });
        window.addEventListener('touchmove', (e) => {
            if (!drag || modalOpen) return;
            const dx = e.touches[0].clientX - startX;
            if (dx !== 0) {
                offsetX -= dx;
                startX = e.touches[0].clientX;
            }
            e.preventDefault();
        });
        window.addEventListener('touchend', () => drag = false);
    }
    
    // 点击随机电影
    function handleClick(e) {
        if (modalOpen) return;
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
            e.preventDefault();
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        let minDist = 20;
        let hit = null;
        for (let dot of visibleDots) {
            const dist = Math.hypot(clientX - dot.screenX, clientY - dot.screenY);
            if (dist < minDist) {
                minDist = dist;
                hit = dot.movie;
            }
        }
        if (hit) {
            // 随机从所有电影中抽取一部（保留惊喜）
            const randomMovie = movies[Math.floor(Math.random() * movies.length)];
            document.getElementById('mTitle').innerText = randomMovie.title;
            document.getElementById('mImg').src = randomMovie.img;
            document.getElementById('mDesc').innerText = randomMovie.desc;
            document.getElementById('mQuote').innerText = randomMovie.quote;
            document.getElementById('modal').style.display = 'flex';
            modalOpen = true;
        }
    }
    
    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        modalOpen = false;
    }
    
    // 星空背景
    function createStars() {
        const starCount = 280;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.4 + 0.5;
            star.style.cssText = `
                width: ${size}px; height: ${size}px;
                left: ${Math.random() * 100}%; top: ${Math.random() * 100}%;
                animation-delay: ${Math.random() * 6}s;
                background: radial-gradient(circle, #ffefb9, #ffcf70);
                opacity: ${Math.random() * 0.7 + 0.3};
                box-shadow: 0 0 5px rgba(255,215,0,0.6);
            `;
            document.body.appendChild(star);
        }
    }
    
    // 窗口自适应
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            resize();
            draw();
        }, 80);
    });
    
    // 启动
    function init() {
        createStars();
        resize();
        initDrag();
        animate();
        
        clickCanvas.addEventListener('click', handleClick);
        clickCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (modalOpen) return;
            handleClick(e);
        });
        document.getElementById('close').onclick = closeModal;
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOpen) closeModal();
        });
    }
    
    init();
</script>
</body>
</html>
