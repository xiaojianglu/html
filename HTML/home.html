<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft Yahei', sans-serif;
            overflow-x: hidden;
            background: #0a1929;
            color: #fff;
            position: relative;
            min-height: 100vh;
        }
        /* 背景图：纯净高清雪山 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: url('https://picsum.photos/id/144/1920/1080') center/cover no-repeat;
        }
        /* 悬浮白点（粒子效果） */
        .dots-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .dot {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
            50% { transform: translateY(-20px) translateX(10px); opacity: 1; }
        }

        /* 导航栏：文字正中间 + 右侧按钮 不重叠 */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem 2rem;
            background: rgba(10, 25, 41, 0.4);
            backdrop-filter: blur(8px);
            position: relative;
            width: 100%;
        }
        /* 核心：导航文字绝对居中 */
        .nav-center {
            display: flex;
            gap: 3rem;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-item {
            padding: 0.5rem 0;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
            font-size: 1.1rem;
        }
        .nav-item.active {
            color: #ff6b81;
        }
        .nav-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #ff6b81;
            transition: width 0.3s;
        }
        .nav-item.active::after {
            width: 100%;
        }
        a.nav-item {
            text-decoration: none;
            color: inherit;
        }

        /* 左侧房子图标 */
        .nav-left {
            z-index: 10;
        }
        .nav-home {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 107, 129, 0.2);
            color: #ff6b81;
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s;
        }
        .nav-home:hover {
            background: rgba(255, 107, 129, 0.4);
            transform: scale(1.1);
        }

        /* 右侧按钮 固定靠右 */
        .nav-right {
            margin-left: auto;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-btn {
            padding: 7px 20px;
            background: #ff6b81;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn:hover {
            background: #ff8fa3;
            transform: scale(1.05);
        }

        /* 购物车图标 */
        .nav-cart {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 107, 129, 0.2);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        .nav-cart:hover {
            background: rgba(255, 107, 129, 0.4);
            transform: scale(1.1);
        }

        /* 白天/黑夜切换按钮 */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 107, 129, 0.2);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            border: none;
        }
        .theme-toggle:hover {
            background: rgba(255, 107, 129, 0.4);
            transform: scale(1.1);
        }

        /* ====== 白天模式 ====== */
        body.light-mode {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
        }
        body.light-mode .bg-container {
            background: url('https://picsum.photos/id/16/1920/1080') center/cover no-repeat;
        }
        body.light-mode .dot {
            background: rgba(0, 0, 0, 0.4);
        }
        body.light-mode nav {
            background: rgba(255, 255, 255, 0.7);
        }
        body.light-mode .nav-item.active {
            color: #ff6b81;
        }
        body.light-mode .nav-home,
        body.light-mode .nav-cart,
        body.light-mode .theme-toggle {
            background: rgba(255, 107, 129, 0.15);
        }
        body.light-mode .profile-card,
        body.light-mode .post-box,
        body.light-mode .feed-item {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.light-mode .feed-header {
            color: #ff6b81;
        }
        body.light-mode .hero-subtitle,
        body.light-mode .hero-title {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            color: #333;
        }
        body.light-mode .name,
        body.light-mode .feed-username {
            color: #333;
        }
        body.light-mode .intro,
        body.light-mode .info-item,
        body.light-mode .feed-content {
            color: #555;
        }
        body.light-mode .divider {
            background: rgba(0, 0, 0, 0.15);
        }
        body.light-mode .feed-time,
        body.light-mode .no-posts {
            color: #888;
        }
        body.light-mode .post-textarea {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
            color: #333;
        }
        body.light-mode .post-textarea::placeholder {
            color: #999;
        }
        body.light-mode .feed-actions {
            border-top-color: rgba(0, 0, 0, 0.1);
        }
        body.light-mode .feed-action-btn {
            color: #666;
        }
        body.light-mode .modal-content {
            background: #fff;
            color: #333;
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.light-mode .modal-content h2 {
            color: #ff6b81;
        }
        body.light-mode .cart-item {
            background: rgba(0, 0, 0, 0.05);
        }
        body.light-mode .cart-item-title {
            color: #333;
        }
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff6b81;
            color: #fff;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* 购物车弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: #1a0b2e;
            max-width: 500px;
            width: 100%;
            max-height: 70vh;
            overflow-y: auto;
            padding: 36px;
            border-radius: 24px;
            border: 1px solid rgba(180, 120, 255, 0.3);
            color: #eee;
            position: relative;
        }
        .modal-content h2 {
            color: #e4cfff;
            margin-bottom: 16px;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 1.6rem;
            cursor: pointer;
            color: #ccc;
        }
        .cart-list {
            margin-top: 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .cart-item img {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 15px;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-title {
            font-size: 1rem;
            color: #e4cfff;
        }
        .cart-item-remove {
            padding: 6px 12px;
            background: rgba(255, 107, 129, 0.3);
            border: none;
            border-radius: 15px;
            color: #ff6b81;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .cart-item-remove:hover {
            background: rgba(255, 107, 129, 0.5);
        }
        .cart-empty {
            text-align: center;
            color: #888;
            padding: 30px;
        }

        /* ====== 左右两栏布局 ====== */
        .main-container {
            display: flex;
            gap: 30px;
            padding: 20px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 左侧个人区域 */
        .left-section {
            flex: 0 0 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 中间大标题 */
        .center-title {
            text-align: center;
            padding: 20px 0;
        }
        .hero-subtitle {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .hero-title {
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(0,0,0,0.7);
        }

        /* 个人卡片 */
        .profile-card {
            width: 100%;
            background: rgba(10, 25, 41, 0.45);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            background: url('https://picsum.photos/id/40/200/200') center/cover;
            border: 3px solid #ff6b81;
        }
        .name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
        }
        .intro {
            font-size: 1rem;
            color: #e0e0e0;
            margin-bottom: 2rem;
        }
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 1.5rem 0;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            margin: 1rem 0;
            font-size: 1rem;
            color: #e0e0e0;
        }
        .contact-btn {
            margin-top: 1.5rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(90deg, #ff6b81, #ff8fa3);
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .contact-btn:hover {
            transform: scale(1.05);
        }

        /* ====== 右侧动态墙 ====== */
        .right-section {
            flex: 1;
            min-width: 0;
        }

        .feed-header {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ff6b81;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 发帖区域 */
        .post-box {
            background: rgba(10, 25, 41, 0.45);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .post-input-wrapper {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .post-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: url('https://picsum.photos/id/40/200/200') center/cover;
            border: 2px solid #ff6b81;
            flex-shrink: 0;
        }
        .post-input-area {
            flex: 1;
        }
        .post-textarea {
            width: 100%;
            min-height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 15px;
            color: #fff;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
        }
        .post-textarea:focus {
            outline: none;
            border-color: #ff6b81;
        }
        .post-textarea::placeholder {
            color: #888;
        }
        .post-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
            gap: 10px;
        }
        .post-btn {
            padding: 10px 25px;
            background: linear-gradient(90deg, #ff6b81, #ff8fa3);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .post-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
        }

        /* 动态列表 */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .feed-item {
            background: rgba(10, 25, 41, 0.45);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s;
        }
        .feed-item:hover {
            transform: translateY(-2px);
        }
        .feed-item-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .feed-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255, 107, 129, 0.5);
        }
        .feed-user-info {
            flex: 1;
        }
        .feed-username {
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
        }
        .feed-time {
            font-size: 0.8rem;
            color: #888;
        }
        .feed-delete {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            transition: color 0.3s;
        }
        .feed-delete:hover {
            color: #ff6b81;
        }
        .feed-content {
            font-size: 1rem;
            line-height: 1.7;
            color: #e0e0e0;
            margin-bottom: 15px;
            word-break: break-word;
        }
        .feed-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .feed-actions {
            display: flex;
            gap: 25px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .feed-action-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            padding: 5px 10px;
            border-radius: 15px;
        }
        .feed-action-btn:hover {
            color: #ff6b81;
            background: rgba(255, 107, 129, 0.1);
        }
        .feed-action-btn.liked {
            color: #ff6b81;
        }

        /* 无动态提示 */
        .no-posts {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .no-posts-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        /* 响应式 */
        @media (max-width: 1000px) {
            .main-container {
                flex-direction: column;
                padding: 20px;
            }
            .left-section {
                flex: none;
                width: 100%;
                max-width: 500px;
                margin: 0 auto;
            }
            .right-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 雪山背景 -->
    <div class="bg-container"></div>
    <!-- 悬浮白点 -->
    <div class="dots-container" id="dots"></div>
    
    <!-- 导航栏 -->
    <nav id="nav">
        <div class="nav-left">
            <a href="Previous.html" class="nav-home" title="返回首页">🏠</a>
        </div>
        <div class="nav-center">
            <div class="nav-item active" data-page="home">主页</div>
            <a href="Resources.html" class="nav-item" data-page="show">电影合集</a>
            <a href="games.html" class="nav-item" data-page="games">游戏厅</a>
        </div>

        <div class="nav-right">
            <button class="theme-toggle" id="themeToggle" title="切换主题">
                🌙
            </button>
            <div class="nav-cart" id="cartBtn" title="我的收藏">
                🛒
                <span class="cart-count" id="cartCount">0</span>
            </div>
            <button class="nav-btn" onclick="alert('切换账号')">切换账号</button>
        </div>
    </nav>

    <!-- 主内容区：左右两栏 -->
    <div class="main-container">
        <!-- 左侧个人区域 -->
        <div class="left-section">
            <!-- 大标题 -->
            <div class="center-title">
                <div class="hero-subtitle">HI!</div>
                <h1 class="hero-title">Hello<br>I`m jiangaixiang</h1>
            </div>

            <!-- 个人卡片 -->
            <div class="profile-card">
                <div class="avatar"></div>
                <div class="name">jiangaixiang</div>
                <div class="intro">好好学习，天天向上</div>
                <div class="divider"></div>
                <div class="info-item">
                    <span>毕业院校</span>
                    <span>重庆理工职业学院</span>
                </div>
                <div class="info-item">
                    <span>所在城市</span>
                    <span>重庆</span>
                </div>
                <div class="info-item">
                    <span>年级</span>
                    <span>25届毕业生</span>
                </div>
                <div class="divider"></div>
                <button class="contact-btn">联系我</button>
            </div>
        </div>

        <!-- 右侧动态墙 -->
        <div class="right-section">
            <div class="feed-header">📢 动态</div>
            
            <!-- 发帖区域 -->
            <div class="post-box">
                <div class="post-input-wrapper">
                    <div class="post-avatar"></div>
                    <div class="post-input-area">
                        <textarea class="post-textarea" id="postInput" placeholder="分享你的想法..."></textarea>
                        <div class="post-actions">
                            <button class="post-btn" onclick="publishPost()">发布</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 动态列表 -->
            <div class="feed-list" id="feedList"></div>
        </div>
    </div>

    <!-- 购物车弹窗 -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close" id="cartClose">&times;</span>
            <h2>📦 我的收藏</h2>
            <div class="cart-list" id="cartList"></div>
        </div>
    </div>

    <script>
        // ====== 主题切换功能 ======
        const themeToggle = document.getElementById('themeToggle');
        let isLightMode = localStorage.getItem('theme') === 'light';

        function applyTheme() {
            if (isLightMode) {
                document.body.classList.add('light-mode');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('light-mode');
                themeToggle.textContent = '🌙';
            }
        }

        themeToggle.onclick = () => {
            isLightMode = !isLightMode;
            localStorage.setItem('theme', isLightMode ? 'light' : 'dark');
            applyTheme();
        };

        applyTheme();

        // 生成悬浮白点
        const dotsContainer = document.getElementById('dots');
        const dotCount = 60;
        for (let i = 0; i < dotCount; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            dot.style.left = Math.random() * 100 + '%';
            dot.style.top = Math.random() * 100 + '%';
            dot.style.animationDelay = Math.random() * 8 + 's';
            dotsContainer.appendChild(dot);
        }

        // 导航栏切换功能
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });

        // 购物车功能
        let favorites = JSON.parse(localStorage.getItem('movieFavorites')) || [];

        function updateCartCount() {
            document.getElementById('cartCount').textContent = favorites.length;
        }

        function renderCartList() {
            const list = document.getElementById('cartList');
            if (favorites.length === 0) {
                list.innerHTML = '<div class="cart-empty">暂无收藏的电影</div>';
                return;
            }
            list.innerHTML = favorites.map(m => `
                <div class="cart-item">
                    <img src="${m.img}" alt="${m.title}">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${m.title}</div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFavorite(${m.id})">移除</button>
                </div>
            `).join('');
        }

        function removeFavorite(id) {
            favorites = favorites.filter(m => m.id !== id);
            localStorage.setItem('movieFavorites', JSON.stringify(favorites));
            updateCartCount();
            renderCartList();
        }

        const cartBtn = document.getElementById('cartBtn');
        const cartModal = document.getElementById('cartModal');
        const cartClose = document.getElementById('cartClose');

        cartBtn.onclick = () => {
            renderCartList();
            cartModal.classList.add('show');
        };
        cartClose.onclick = () => cartModal.classList.remove('show');
        cartModal.onclick = (e) => {
            if (e.target === cartModal) cartModal.classList.remove('show');
        };

        updateCartCount();

        // ====== 动态墙功能 ======
        
        // 示例用户数据
        const sampleUsers = [
            { name: '小明', avatar: 'https://picsum.photos/id/64/100/100' },
            { name: '小红', avatar: 'https://picsum.photos/id/65/100/100' },
            { name: '阿杰', avatar: 'https://picsum.photos/id/66/100/100' },
            { name: '小美', avatar: 'https://picsum.photos/id/67/100/100' },
            { name: '小刚', avatar: 'https://picsum.photos/id/68/100/100' }
        ];

        // 示例动态
        const samplePosts = [
            {
                id: Date.now() - 100000,
                user: '小明',
                avatar: 'https://picsum.photos/id/64/100/100',
                content: '今天天气真好，适合出去走走！🌸',
                time: '2小时前',
                likes: 12,
                liked: false,
                comments: 3
            },
            {
                id: Date.now() - 200000,
                user: '小红',
                avatar: 'https://picsum.photos/id/65/100/100',
                content: '分享一张最近拍的照片，周末去了趟郊区，风景太美了！大家周末都去哪玩了？',
                image: 'https://picsum.photos/id/15/600/400',
                time: '5小时前',
                likes: 28,
                liked: false,
                comments: 8
            },
            {
                id: Date.now() - 300000,
                user: '阿杰',
                avatar: 'https://picsum.photos/id/66/100/100',
                content: '推荐一部最近看的电影《盗梦空间》，诺兰的神作，烧脑但非常精彩！🎬',
                time: '昨天',
                likes: 45,
                liked: false,
                comments: 15
            }
        ];

        // 加载帖子
        let posts = JSON.parse(localStorage.getItem('qzonePosts')) || samplePosts;

        function savePosts() {
            localStorage.setItem('qzonePosts', JSON.stringify(posts));
        }

        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return '刚刚';
            if (minutes < 60) return `${minutes}分钟前`;
            if (hours < 24) return `${hours}小时前`;
            if (days < 7) return `${days}天前`;
            return date.toLocaleDateString();
        }

        function renderPosts() {
            const feedList = document.getElementById('feedList');
            
            if (posts.length === 0) {
                feedList.innerHTML = `
                    <div class="no-posts">
                        <div class="no-posts-icon">📝</div>
                        <div>还没有动态，来发第一条吧！</div>
                    </div>
                `;
                return;
            }

            feedList.innerHTML = posts.map(post => `
                <div class="feed-item" data-id="${post.id}">
                    <div class="feed-item-header">
                        <div class="feed-avatar" style="background-image: url('${post.avatar}')"></div>
                        <div class="feed-user-info">
                            <div class="feed-username">${post.user}</div>
                            <div class="feed-time">${post.time}</div>
                        </div>
                        ${post.user === 'jiangaixiang' ? `<button class="feed-delete" onclick="deletePost(${post.id})">🗑️</button>` : ''}
                    </div>
                    <div class="feed-content">${post.content}</div>
                    ${post.image ? `<img class="feed-image" src="${post.image}" alt="帖子图片">` : ''}
                    <div class="feed-actions">
                        <button class="feed-action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                            ❤️ ${post.likes}
                        </button>
                        <button class="feed-action-btn">
                            💬 ${post.comments}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function publishPost() {
            const input = document.getElementById('postInput');
            const content = input.value.trim();
            
            if (!content) {
                alert('请输入内容');
                return;
            }

            const newPost = {
                id: Date.now(),
                user: 'jiangaixiang',
                avatar: 'https://picsum.photos/id/40/200/200',
                content: content,
                time: '刚刚',
                likes: 0,
                liked: false,
                comments: 0
            };

            posts.unshift(newPost);
            savePosts();
            renderPosts();
            input.value = '';
        }

        function deletePost(id) {
            if (confirm('确定删除这条动态吗？')) {
                posts = posts.filter(p => p.id !== id);
                savePosts();
                renderPosts();
            }
        }

        function toggleLike(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                savePosts();
                renderPosts();
            }
        }

        // 初始化
        renderPosts();

        // 回车发布
        document.getElementById('postInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                publishPost();
            }
        });
    </script>
</body>
</html>
